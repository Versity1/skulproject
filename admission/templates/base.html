<!DOCTYPE html>
<html class="scroll-smooth" lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}St. Jude's Academy{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&amp;family=Inter:wght@400;600&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#031632',
                        'primary-container': '#1a2b48',
                        'on-primary': '#ffffff',
                        'on-primary-container': '#8293b5',
                        secondary: '#376757',
                        'surface': '#f9f9ff',
                        'surface-container-low': '#f0f3ff',
                        'surface-container-lowest': '#ffffff',
                        'on-surface': '#111c2c',
                        'on-surface-variant': '#44474d',
                        'tertiary-fixed': '#ffe088',
                        'tertiary-fixed-dim': '#e9c349',
                        'tertiary-container': '#cca730',
                        'on-tertiary-fixed': '#241a00',
                        outline: '#75777e'
                    },
                    spacing: {
                        'gutter': '24px',
                        'section-gap': '80px',
                        'container-max': '1200px',
                        'margin-desktop': '48px',
                        'margin-mobile': '16px'
                    },
                    fontFamily: {
                        'headline-md': ['Playfair Display'],
                        'headline-md-mobile': ['Playfair Display'],
                        'body-md': ['Inter'],
                        'body-lg': ['Inter'],
                        'display-lg': ['Playfair Display'],
                        'display-lg-mobile': ['Playfair Display'],
                        'title-sm': ['Playfair Display'],
                        'label-caps': ['Inter'],
                        button: ['Inter']
                    },
                    fontSize: {
                        'headline-md': ['32px', { lineHeight: '1.3', fontWeight: '600' }],
                        'headline-md-mobile': ['24px', { lineHeight: '1.3', fontWeight: '600' }],
                        'body-md': ['16px', { lineHeight: '1.5' }],
                        'body-lg': ['18px', { lineHeight: '1.6' }],
                        'display-lg': ['48px', { lineHeight: '1.2', fontWeight: '700' }],
                        'display-lg-mobile': ['32px', { lineHeight: '1.2', fontWeight: '700' }],
                        'title-sm': ['20px', { lineHeight: '1.4', fontWeight: '600' }],
                        'label-caps': ['12px', { lineHeight: '1.2', letterSpacing: '0.1em', fontWeight: '600' }],
                        button: ['14px', { lineHeight: '1', fontWeight: '600' }]
                    }
                }
            }
        }
    </script>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .icon-fill { font-variation-settings: 'FILL' 1; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-surface text-on-surface font-body-md pt-20">
    <header class="bg-surface text-primary fixed top-0 w-full border-b border-outline/20 shadow-sm z-50">
        <div class="flex justify-between items-center max-w-container-max mx-auto px-margin-mobile md:px-margin-desktop h-20">
            <a class="font-display-lg text-display-lg-mobile md:text-display-lg text-primary" href="{% url 'home' %}">St. Jude's Academy</a>
            <nav class="hidden md:flex gap-8">
                <a class="font-button text-button uppercase tracking-wider text-on-surface-variant hover:text-tertiary-container transition-colors duration-300" href="{% url 'admission_apply' %}">Admissions</a>
                <a class="font-button text-button uppercase tracking-wider text-on-surface-variant hover:text-tertiary-container transition-colors duration-300" href="{% url 'result_lookup' %}">Academics</a>
                <a class="font-button text-button uppercase tracking-wider text-on-surface-variant hover:text-tertiary-container transition-colors duration-300" href="{% url 'home' %}#about">About</a>
                <a class="font-button text-button uppercase tracking-wider text-on-surface-variant hover:text-tertiary-container transition-colors duration-300" href="{% url 'home' %}#contact">Contact</a>
            </nav>
            <a class="font-button text-button bg-primary text-on-primary px-6 py-3 rounded hover:opacity-90 transition-opacity" href="{% url 'result_lookup' %}">Portal</a>
        </div>
    </header>
    {% block content %}{% endblock %}
</body>
</html>
